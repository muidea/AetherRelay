# Define this map once in the http context (for example in conf.d).
# Empty Upgrade preserves ordinary HTTP without a Connection header.
map $http_upgrade $aetherrelay_connection_upgrade {
    default upgrade;
    ''      '';
}

# Merge this location into the existing api.test.abc server block.
# Default application budget: 300s. Clients should allow at least 360s.
# X-Stainless-Timeout also caps buffered Codex requests with a delivery reserve.
location ^~ /v1 {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aetherrelay_connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;
    # SSE events must reach clients promptly. Buffered JSON still waits for
    # completion; disabling buffering does not turn a unary call into SSE.
    proxy_buffering off;
    proxy_cache off;
}
