server:
  # 非 loopback 监听需由网络层保护数据端点。
  listen_addr: 127.0.0.1:8080
  max_request_body_bytes: 33554432
  max_upstream_response_bytes: 67108864
  max_stream_bytes: 67108864
  max_sse_line_bytes: 1048576
  # 归档默认关闭；完整正文与未脱敏 header 可能含凭据，仅限受控排障。
  archive_interactions: false
  archive_full_content: false
  archive_unredacted_headers: false
  verbose_logging: true
  log_format: text
  request_timeout_seconds: 300
  stream_idle_timeout_seconds: 300
  # 首事件超时应短于流空闲超时；90 秒兼容 Codex OAuth 大上下文冷启动。
  stream_first_event_timeout_seconds: 180
  upstream_body_idle_timeout_seconds: 180
  metrics_remote_access: false
  # 远程指标访问启用后，空白名单表示允许任意来源。
  metrics_allowed_cidrs:
  # 仅信任这些直接反向代理提供的 X-Forwarded-Proto。
  trusted_proxy_cidrs: 127.0.0.1/32, ::1/128
  # SLO 字段为 0 时禁用对应规则。
  slo_cache_hit_rate_min: 0.2
  slo_upstream_error_rate_max: 0.05
  slo_p99_latency_max_ms: 30000
  slo_check_interval_seconds: 60
  slo_violation_webhook:

  # Admin 可选配置；密码仅接受 Argon2id PHC 哈希。
  # admin_auth_enabled: false
  # admin_base_path: /admin
  # admin_default_language: zh-CN
  # admin_username: ops-admin
  # admin_password_hash: ${AETHERRELAY_ADMIN_PASSWORD_HASH}
  # admin_session_cookie_secure: false
  # admin_session_ttl_seconds: 28800

# 路由按 exact model 与 priority 选择；不支持请求侧指定 Provider。
# API Key、Provider 与账号凭据由 Admin 管理并加密保存到 state.database。
# 每个实例必须独占 state.dir。
state:
  dir: var
  database: aetherrelay.duckdb
  memory_limit: 256MB
  threads: 2
  query_cache_seconds: 15
  interaction_retention: 500

# ChatGPT Web 账号由 Admin 导入，凭据不写入本配置。
chatgpt_web:
  provider_enabled: true
  priority: 10
  # 0 关闭账号自动刷新。
  refresh_account_interval_minute: 15
  temporary_chat:
    enabled: true
    retention_days: 30
    max_conversations: 2000
    max_messages_per_conversation: 200
    max_message_bytes: 262144
    turn_timeout_seconds: 300

# Codex OAuth 凭据仅保存于 state.database；fingerprint_mode 为账号级状态，
# 仅支持 off/scoped，缺省为 scoped，通过管理页或账号池 bundle 调整。
codex_oauth:
  # HTTP 流单次尝试的独立总时限；0 关闭。首事件和空闲超时仍由 server 控制。
  stream_max_duration_seconds: 0
  provider_enabled: true
  priority: 90
  # 0 关闭周期刷新；401 仍会刷新并安全重试一次。
  refresh_account_interval_minute: 30
  # 0 关闭主动用量刷新；Responses 响应头仍会被动更新。
  usage_refresh_interval_minute: 10
  websocket_max_sessions: 128
  websocket_max_message_bytes: 1048576
  websocket_idle_timeout_seconds: 300
  websocket_max_lifetime_seconds: 1800
  # 客户端未提供 Turn-State 时，按其会话回填最近观测值。
  turn_state_fallback: true
  # 无会话记录时的 opaque 兜底值；空值表示不发送该 header。
  default_turn_state: ""
  # 强制使用兜底值并忽略客户端/会话值；启用时兜底值不能为空。
  turn_state_force_default: false

# metadata 仅按精确模型 ID 补充能力，不创建路由。
