server:
  # 默认仅绑定 loopback。若改为 0.0.0.0:8080 / :8080 等非 loopback,
  # client_api_keys 是归属机制而非强制登录;非 loopback 需由网络层保护。
  listen_addr: 127.0.0.1:8080
  # 请求体 / 上游响应大小上限(字节)。
  max_request_body_bytes: 33554432
  max_upstream_response_bytes: 67108864
  # 流式累计输出与单条 SSE 行上限。
  max_stream_bytes: 67108864
  max_sse_line_bytes: 1048576
  # 是否落盘完整请求/响应正文;false 时仅保留 metadata 等元数据。
  archive_full_content: true
  debug_log: true
  log_format: text
  request_timeout_seconds: 300
  stream_idle_timeout_seconds: 300
  # 可观测性端点(/metrics, /stats)访问控制。默认仅 loopback 可访问,
  # 在受信内网可以设为 true 开放给 Prometheus / TUI 拉取。
  metrics_remote_access: false
  # 可选:白名单 CIDR 列表(逗号分隔),仅在 metrics_remote_access=true 时生效。
  # 非空:仅允许列表内网段(+loopback);空:允许任意远程来源。
  metrics_allowed_cidrs:
  # SLO 阈值:任一字段保持 0 即禁用对应规则。
  # slo_cache_hit_rate_min: 单 provider 最低缓存命中率(0~1),样本不足 10 跳过。
  # slo_upstream_error_rate_max: 单 provider 最高上游错误率(0~1)。
  # slo_p99_latency_max_ms: 单 provider p99 延迟上限(毫秒)。
  # slo_check_interval_seconds: 后台巡检周期,0 表示禁用周期检查。
  # slo_violation_webhook: 状态变化时异步 POST {entered,resolved};有界队列+4 worker。
  # 持续违规不重复投递。尽力而为:shutdown 不等待;日志仅 scheme://host。
  slo_cache_hit_rate_min: 0.2
  slo_upstream_error_rate_max: 0.05
  slo_p99_latency_max_ms: 30000
  slo_check_interval_seconds: 60
  slo_violation_webhook:

  # Admin 登录安全（可选）。默认 false：Admin 仅 loopback 可访问。
  # 设为 true 后取消来源限制，必须先登录；HTTP/HTTPS 均可访问。
  # admin_auth_enabled: false
  # Admin 页面/API 前缀，默认 /admin；启动期路由，变更需重启。
  # admin_base_path: /admin
  # Admin Web 的实例默认语言：zh-CN 或 en-US，默认 zh-CN；管理页可热更新。
  # admin_default_language: zh-CN
  # 单管理员账号（区分大小写）。
  # admin_username: ops-admin
  # 仅接受 Argon2id PHC 哈希；用 `ai-proxy admin password-hash` 生成后注入。
  # admin_password_hash: ${AI_PROXY_ADMIN_PASSWORD_HASH}
  # true 时会话 Cookie 仅随 HTTPS 请求发送；默认 false，兼容 HTTP。
  # admin_session_cookie_secure: false
  # 会话绝对有效期（秒），默认 28800（8h），范围 300~86400。
  # admin_session_ttl_seconds: 28800

# 路由仅按 model_catalog exact model。一个模型可匹配多个 enabled Provider：
# 按 priority 降序选择；同优先级按 Provider 名稳定排序。仅在客户端尚未收到响应时，
# 对网络错误、408、429、5xx 与首个流事件失败尝试 fallback: true 的下一候选。
# 不支持 default_provider、fallbacks 列表或请求侧强制指定 Provider。
# 客户端使用标准 path:
#   OpenAI:  POST /v1/chat/completions|/v1/responses|/v1/completions|/v1/embeddings, GET/POST /v1/models
#   Anthropic: POST /v1/messages
# 已禁用 X-AI-Provider / ?provider= / provider/model 显式选择。
# endpoint_capabilities 仅声明上游直连能力;客户端可服务 path 由 TransportPlan 矩阵决定
# (含 OpenAI chat ↔ Anthropic messages 基础文本转换)。

# 客户端 API Key。所有数据端点均需携带一个已启用的 Key。
# client_api_keys:
#   codex:
#     api_key: ${CODEX_API_KEY}
#     enabled: true

# 单一持久化工作区：DuckDB 保存用量、账号、任务和图片元数据；
# 原始图片、缩略图和交互归档保存在固定子目录。每个实例必须独占该目录。
state:
  dir: var
  database: state.duckdb
  memory_limit: 256MB
  threads: 2
  query_cache_seconds: 15
  interaction_retention: 500

# ChatGPT Web 账号池与图片能力。默认关闭；账号凭据不写入本配置，
chatgpt_web:
  enabled: false
  # 控制内建 Provider 是否参与模型路由；不影响账号池、图片与临时对话。
  # 省略时跟随 enabled；Provider 管理页可热更新此项。
  provider_enabled: false
  # 内建 Provider 的候选优先级，范围 -1000~1000；省略时为 10。
  priority: 10
  # 0 关闭定期刷新；手工刷新仍由后续 Admin API 发起。
  refresh_account_interval_minute: 0
  # Admin 临时文本多轮对话（服务端 DuckDB 持久化；浏览器不落会话正文）
  temporary_chat:
    enabled: true
    retention_days: 30
    max_conversations: 2000
    max_messages_per_conversation: 200
    max_message_bytes: 262144
    turn_timeout_seconds: 300

# 独立 Codex CLI OAuth 账号池。凭据仅保存于 state.database，不写入 YAML。
# 模型按账号自动发现并缓存，健康账号快照的并集会对外发布；它们仅服务
# 原生 POST /v1/responses。
codex_oauth:
  enabled: false
  # 控制内建 Provider 是否参与模型路由；不影响 Codex 账号池维护。
  # 省略时跟随 enabled；Provider 管理页可热更新此项。
  provider_enabled: false
  # 内建 Provider 的候选优先级，范围 -1000~1000；省略时为 90。
  priority: 90
  # 0 关闭临期令牌的周期刷新；401 时仍会单飞刷新并安全重试一次。
  refresh_account_interval_minute: 0

providers:
  # 每个 enabled provider 必须显式声明 protocol、base_url、endpoint_capabilities。
  # 远程空 api_key 启动失败；仅 loopback 上游可设 allow_unauthenticated: true。
  # models pattern 为大小写敏感的 glob；model_catalog 的每个条目必须被
  # 至少一个 enabled provider 匹配（启动期校验）。
  openai:
    enabled: true
    protocol: openai
  # base_url 可带或不带 /v1；代理会按入站 path 智能拼接并去重。
    base_url: https://onlycode.shop/v1
    api_key: ${OPENAI_API_KEY}
    # 省略时为 100；范围 -1000~1000，数值越大优先级越高。
    priority: 100
    # 作为低优先级候选时是否允许安全回退；省略时为 true。
    fallback: true
    endpoint_capabilities: chat_completions, responses, completions
    models: gpt-*, chatgpt-*, o*
  # 官方 DeepSeek（小写模型 ID）
  deepseek:
    enabled: true
    protocol: openai
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
    priority: 100
    fallback: true
    endpoint_capabilities: chat_completions, responses, completions
    models: deepseek-v4-flash
  # 精确模型 grok-4.5（大小写敏感，pattern 需原文匹配）
  krill-ai:
    enabled: true
    protocol: openai
    base_url: https://api.krill-ai.com/v1
    api_key: ${KRILL_AI_API_KEY}
    priority: 100
    fallback: true
    endpoint_capabilities: chat_completions, responses, completions
    models: grok-4.5
  # MiniMax 系列（base_url 无 /v1，代理会按入站 path 拼接）
  minimax:
    enabled: true
    protocol: openai
    base_url: https://aiapi.bluetron.cn
    api_key: ${MINIMAX_API_KEY}
    priority: 100
    fallback: true
    endpoint_capabilities: chat_completions
    models: MiniMax*
  # 精确模型 DeepSeek-V4-Flash（大写，与官方小写 ID 并存于候选链）
  aiapi-deepseek:
    enabled: true
    protocol: openai
    base_url: https://aiapi.bluetron.cn
    api_key: ${AIApi_DEEPSEEK_API_KEY}
    priority: 100
    fallback: true
    endpoint_capabilities: chat_completions
    models: DeepSeek-V4-Flash
  # 本机/内网 embedding 服务示例（仅 loopback 上游可设 allow_unauthenticated，
  # 此时不得同时配置 api_key）
  embedding-e5:
    enabled: true
    protocol: openai
    base_url: http://127.0.0.1:8010
    allow_unauthenticated: true
    priority: 100
    fallback: true
    endpoint_capabilities: embeddings
    models: intfloat/multilingual-e5-small
  # 如需 Anthropic 协议转换（/v1/messages ↔ openai chat），自行添加
  # protocol: anthropic 的 provider 并在 catalog 登记对应模型。
  # chatgptweb 与 codexoauth 是保留的内建 Provider ID，禁止在 providers 中声明。
  # 启用 chatgpt_web.enabled 后由运行时自动注入，模型来自账号池发现结果。

# 全局模型目录(各 Provider 共用)。model ID 严格区分大小写(exact match)。
# GET /v1/models 仅返回此处登记的模型,
# 并附带 contextWindowTokens / maxOutputTokens / operations。model_catalog 是路由与能力的共同 authority。
model_catalog:
  # 与 providers.models pattern 大小写敏感匹配；同名内建模型会共同构成候选链。
  DeepSeek-V4-Flash:
    context_window_tokens: 1000000
    max_output_tokens: 65536
    operations: chat_completions
  deepseek-v4-flash:
    context_window_tokens: 1000000
    max_output_tokens: 65536
    operations: chat_completions
  gpt-5.5:
    context_window_tokens: 400000
    max_output_tokens: 128000
    operations: chat_completions
  MiniMax-M3:
    context_window_tokens: 1000000
    max_output_tokens: 32768
    operations: chat_completions
  gpt-5.3-codex:
    context_window_tokens: 400000
    max_output_tokens: 128000
    operations: chat_completions
  grok-4.5:
    context_window_tokens: 500000
    max_output_tokens: 16384
    operations: chat_completions
  MiniMax-M2.7-highspeed:
    context_window_tokens: 204800
    max_output_tokens: 32768
    operations: chat_completions
  intfloat/multilingual-e5-small:
    context_window_tokens: 512
    max_output_tokens: 1
    operations: embeddings
  # ChatGPT Web 与 Codex OAuth 自动发现的模型不写入 model_catalog。

  # 同名静态与自动模型会共同构成候选链：静态默认 priority=100，
  # Codex OAuth 固定为 90（可用于原生 /v1/responses 回退），
  # ChatGPT Web 固定为 10 且默认不作为回退。
